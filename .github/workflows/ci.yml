name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    # For the database integration tests, which are skipped when TEST_DATABASE_URL isn't set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plinth
          POSTGRES_PASSWORD: plinth
          POSTGRES_DB: plinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plinth -d plinth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          TEST_DATABASE_URL: postgres://plinth:plinth@localhost:5432/plinth_test
