version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT}
      - DATABASE_URL=postgres://plinth:plinth@db:5432/plinth
    volumes:
      - ./server/src:/app/src
      - ./server/migrations:/app/migrations
      - ./shared:/shared
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '5173:5173'
    environment:
      - API_PROXY_TARGET=http://server:3001
      - VITE_MONZO_URL=${VITE_MONZO_URL}
      - VITE_FEEDBACK_EMAIL=${VITE_FEEDBACK_EMAIL}
    volumes:
      - ./client/src:/app/src
      - ./shared:/shared
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Local development only; Railway provides its own credentials.
      - POSTGRES_USER=plinth
      - POSTGRES_PASSWORD=plinth
      - POSTGRES_DB=plinth
    ports:
      # Lets `npm run dev` outside Docker use this database too (see .env.example).
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plinth -d plinth']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
